name: release-v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; nothing to do.'
            exit 0
          fi
          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title 'v0.1.0 — Causal inference technical bench' \
            --notes 'Initial public release of causal-inference-from-scratch: from-scratch estimator implementations, known-truth tests, assumptions/failure-mode documentation, and timed RA-style exercises. Intended as a technical training and research-engineering resource rather than a replacement for validated production econometrics packages.'
